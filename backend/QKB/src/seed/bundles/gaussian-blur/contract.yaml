schema: quantify-kb/1
category: analysis
purpose: Blur the image to reduce noise.
inputs:
  - port_id: image
    name: Image
    artifact_kind: image2d
    dtype: float32
    unit: intensity
    coordinate_space: image-pixel
    calibration: none
    multiplicity: { min: 1, max: 1 }
    required: true
outputs:
  - port_id: image
    name: Image
    artifact_kind: image2d
    dtype: float32
    unit: intensity
    coordinate_space: image-pixel
    calibration: none
    multiplicity: { min: 1, max: 1 }
    same_source_as: [image]
parameters:
  - parameter_id: sigma
    type: number
    meaning: Blur strength in pixels.
    range: { min: 0.5, max: 6 }
    unit: pixel
    required: true
    default: 2
prerequisites: []
reproducibility: { deterministic: true, cacheable: true, needs_seed: false, external_state: [] }
