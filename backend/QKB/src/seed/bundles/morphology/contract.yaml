schema: quantify-kb/1
category: analysis
purpose: Clean up a binary mask with a morphological operation.
inputs:
  - port_id: mask
    name: Mask
    artifact_kind: mask2d
    dtype: uint8
    value_domain: [0, 1]
    unit: none
    coordinate_space: image-pixel
    calibration: none
    multiplicity: { min: 1, max: 1 }
    required: true
outputs:
  - port_id: mask
    name: Mask
    artifact_kind: mask2d
    dtype: uint8
    value_domain: [0, 1]
    unit: none
    coordinate_space: image-pixel
    calibration: none
    multiplicity: { min: 1, max: 1 }
    same_source_as: [mask]
parameters:
  - parameter_id: op
    type: enum
    meaning: Which operation to apply.
    allowed: [open, close, erode, dilate]
    required: true
    default: open
  - parameter_id: radius
    type: integer
    meaning: Structuring-element radius in pixels.
    range: { min: 1, max: 8 }
    unit: pixel
    required: true
    default: 2
prerequisites: []
reproducibility: { deterministic: true, cacheable: true, needs_seed: false, external_state: [] }
