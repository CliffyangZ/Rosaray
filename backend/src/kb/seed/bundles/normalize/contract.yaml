schema: quantify-kb/1
category: analysis
purpose: Stretch intensities so the low and high percentiles map to 0 and 255.
inputs:
  - port_id: image
    name: Image
    artifact_kind: image2d
    dtype: float32
    unit: intensity
    coordinate_space: image-pixel
    calibration: none
    multiplicity: { min: 1, max: 1 }
    required: true
outputs:
  - port_id: image
    name: Image
    artifact_kind: image2d
    dtype: float32
    value_domain: [0, 255]
    unit: intensity
    coordinate_space: image-pixel
    calibration: none
    multiplicity: { min: 1, max: 1 }
    same_source_as: [image]
parameters:
  - parameter_id: lo
    type: number
    meaning: Low percentile mapped to 0.
    range: { min: 0, max: 20 }
    unit: percent
    required: true
    default: 1
  - parameter_id: hi
    type: number
    meaning: High percentile mapped to 255.
    range: { min: 80, max: 100 }
    unit: percent
    required: true
    default: 99
prerequisites: []
reproducibility: { deterministic: true, cacheable: true, needs_seed: false, external_state: [] }
