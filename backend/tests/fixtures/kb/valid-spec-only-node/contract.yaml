schema: quantify-kb/1
category: measurement
purpose: Report an edge-sharpness score for an intensity image.
inputs:
  - port_id: image
    name: Image
    artifact_kind: image2d
    dtype: float32
    unit: intensity
    coordinate_space: image-pixel
    calibration: none
    multiplicity: { min: 1, max: 1 }
    required: true
outputs:
  - port_id: score
    name: Sharpness score
    artifact_kind: scalar
    dtype: float32
    unit: none
    multiplicity: { min: 1, max: 1 }
    same_source_as: [image]
parameters:
  - parameter_id: window
    type: integer
    meaning: Window size in pixels.
    range: { min: 3, max: 31 }
    unit: pixel
    required: true
prerequisites: []
reproducibility: { deterministic: true, cacheable: true, needs_seed: false, external_state: [] }
